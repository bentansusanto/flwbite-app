name: Build and Deploy Production

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-vps:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to aaPanel via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_FLWBITE_APP_HOST }}
          username: ${{ secrets.VPS_FLWBITE_APP_USERNAME }}
          key: ${{ secrets.VPS_FLWBITE_APP_SSH_KEY }}
          port: ${{ secrets.VPS_FLWBITE_APP_PORT || 22 }}
          script: |
            # Pindah ke direktori flwbite-app-prod
            cd /www/wwwroot/flwbite-app/flwbite-app-prod || cd /root/flwbite-app-prod
            
            # Tarik kode terbaru untuk docker-compose.prod.yml (opsional jika manual setup)
            git pull origin master || true
            
            # Login ke GHCR di VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Tarik image terbaru
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production
            
            # Restart container
            export DOCKER_TAG=production
            export ENV_NAME=production
            docker compose -f docker-compose.prod.yml up -d
            
            # Bersihkan image lama untuk menghemat disk VPS
            docker image prune -f
